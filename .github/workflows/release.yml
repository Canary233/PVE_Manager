name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      release_name:
        description: Release title (defaults to the tag)
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean
      generate_notes:
        description: Generate release notes from merged changes
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7
            target_platform: android-arm
            apk_abi: armeabi-v7a
          - name: armv8
            target_platform: android-arm64
            apk_abi: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag_name must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          echo "build_name=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release APK
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.target_platform }}
          --split-per-abi
          --build-name ${{ steps.version.outputs.build_name }}
          --build-number ${{ github.run_number }}

      - name: Rename release APK
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p release-assets
          cp "build/app/outputs/flutter-apk/app-${{ matrix.apk_abi }}-release.apk" \
            "release-assets/pve-manager-${RELEASE_TAG}-android-${{ matrix.name }}.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v7
        with:
          name: pve-manager-release-android-${{ matrix.name }}
          path: release-assets/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw 'tag_name must look like v1.2.3 or v1.2.3-rc.1'
          }
          $version = $tag.Substring(1).Split('-')[0]
          "build_name=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --build-name ${{ steps.version.outputs.build_name }}
          --build-number ${{ github.run_number }}

      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "release-assets/pve-manager-$env:RELEASE_TAG-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: pve-manager-release-windows
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: pve-manager-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * | sort -k2 > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_GENERATE_NOTES: ${{ inputs.generate_notes }}
        shell: bash
        run: |
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$RELEASE_TAG"
          fi

          args=(
            "$RELEASE_TAG"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
          )
          if [ "$RELEASE_GENERATE_NOTES" = 'true' ]; then
            args+=(--generate-notes)
          fi
          if [ "$RELEASE_DRAFT" = 'true' ]; then
            args+=(--draft)
          fi
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
